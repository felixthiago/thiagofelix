<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Fundo invisível para manter a proporção -->
  <rect width="100" height="100" fill="transparent"/>
  
  <!-- O Círculo Perfeito (A Borda da Caixa antes da distorção) -->
  <circle cx="50" cy="50" r="45" stroke="#E7E5E4" stroke-width="2" opacity="0.3"/>
  
  <!-- A Linha Sinuosa (O Fio Abissal) -->
  <path d="M40,20 C30,50 70,50 60,80" stroke="#E7E5E4" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  
  <!-- O Monograma "TF" Alinhado ao Centro -->
  <!-- A fonte Helvetica/Arial simula o Brutalismo clean contra o caos -->
  <text 
    x="50%" 
    y="54%" 
    text-anchor="middle" 
    font-family="sans-serif" 
    font-weight="300" 
    font-size="18" 
    letter-spacing="2" 
    fill="#E7E5E4"
    opacity="0.9"
  >
    TF
  </text>
</svg>
